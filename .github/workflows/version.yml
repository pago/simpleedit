name: Version

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create release PR or tag
        id: changesets
        uses: changesets/action@v1
        with:
          title: "Version Packages"
          commit: "Version Packages"
          version: pnpm changeset version
          publish: pnpm changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Read after changesets: when this run is a merged "Version Packages" PR,
      # package.json is already at the released version, which is the tag
      # `changeset tag` just pushed. Only consumed when published == 'true'.
      - name: Read the released version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write

  # Chained explicitly rather than triggered by the `release` event: the release
  # is created with GITHUB_TOKEN, and GitHub does not let those events start new
  # workflow runs. This is the same reason `release` above is called rather than
  # left to the pushed v* tag.
  homebrew:
    needs: [version, release]
    if: needs.version.outputs.published == 'true'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
