name: CI

on:
  pull_request:
  push:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Chromium for browser component tests
        run: pnpm exec playwright install chromium --with-deps

      - name: Browser component tests
        run: pnpm test:browser

      - name: Build
        run: pnpm build

      - name: Install Electron system dependencies
        run: sudo apt-get install -y libgbm1 libnss3 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libxss1

      - name: E2E tests
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
