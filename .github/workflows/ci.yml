name: CI

on:
  pull_request:
  push:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Electron 42 has no postinstall: the first `require('electron')` downloads
      # the binary. Parallel vitest workers would each start that download and
      # race on dist/, so fetch it once here.
      - name: Install Electron binary
        run: pnpm exec install-electron

      # Needed before anything executes the Electron binary: it links these
      # libraries even when run as plain Node by the guard below.
      - name: Install Electron system dependencies
        run: sudo apt-get install -y libgbm1 libnss3 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libxss1

      # Tests must run on the Node that ships inside Electron. An Electron bump
      # that changes its bundled Node fails here until .tool-versions follows.
      - name: Node matches Electron's bundled Node
        run: |
          host=$(node -p process.versions.node)
          bundled=$(ELECTRON_RUN_AS_NODE=1 pnpm exec electron -p process.versions.node)
          if [ "$host" != "$bundled" ]; then
            echo "::error file=.tool-versions::CI runs Node $host but Electron bundles Node $bundled. Set 'nodejs $bundled' in .tool-versions."
            exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Chromium for browser component tests
        run: pnpm exec playwright install chromium --with-deps

      - name: Browser component tests
        run: pnpm test:browser

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
