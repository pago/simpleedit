appId: com.simpleedit.app
productName: SimpleEdit
directories:
  buildResources: build
  output: dist

publish:
  provider: github
  owner: pago
  repo: simpleedit

files:
  - out/**/*

extraResources:
  - from: out/mcp-server/
    to: mcp-server/

asarUnpack:
  - "node_modules/node-pty/**"

# Disable electron-builder's own signing; scripts/mac-adhoc-sign.cjs ad-hoc
# signs the fully-assembled bundle in afterPack so the signature covers the
# node-pty and mcp-server payloads and is the last write before dmg/zip.
afterPack: scripts/mac-adhoc-sign.cjs

mac:
  identity: null
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
